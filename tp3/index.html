<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TP3 - Formulaire Bootstrap & JS</title>
    
    <!-- Script du Thème -->
    <script src="../js/theme.js"></script>
    
    <!-- Polices & Icônes -->
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Fichier CSS Bootstrap demandé par le TP -->
    <link rel="stylesheet" href="css/bootstrap.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Styles personnalisés du Thème (intégrés pour ne pas ajouter de fichier dans /css) -->
    <style>
        /* --- VARIABLES ET THEMES (SOMBRE & CLAIR) --- */
        :root, [data-theme="dark"] {
            --bg-main: #0b0f17;
            --bg-card: #131b27;
            --input-bg: #0b0f17;
            --border-color: #233144;
            --accent-cyan: #00f2fe;
            --accent-blue: #0d6efd;
            --text-main: #f0f6fc;
            --text-muted: #94a3b8;
            --shadow-color: rgba(0, 0, 0, 0.4);
            --font-sans: 'Inter', sans-serif;
            --font-mono: 'Fira Code', monospace;
            --close-filter: invert(1);
        }

        [data-theme="light"] {
            --bg-main: #f8fafc;
            --bg-card: #ffffff;
            --input-bg: #ffffff;
            --border-color: #cbd5e1;
            --accent-cyan: #0284c7;
            --accent-blue: #0d6efd;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --shadow-color: rgba(0, 0, 0, 0.08);
            --close-filter: none;
        }

        body {
            background-color: var(--bg-main) !important;
            background-image: none !important;
            color: var(--text-main);
            font-family: var(--font-sans);
            min-height: 100vh;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .page-title {
            color: var(--text-main);
        }

        /* Navigation haute */
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: var(--font-mono);
            font-size: 0.9rem;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
            flex-wrap: wrap;
            gap: 1rem;
            transition: border-color 0.3s ease;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .nav-brand {
            color: var(--text-muted);
        }

        .back-btn {
            color: var(--text-main);
            text-decoration: none;
            background: var(--bg-card);
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            color: var(--accent-cyan);
            border-color: var(--accent-cyan);
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.2);
        }

        .theme-btn {
            background: var(--bg-card);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            cursor: pointer;
            font-family: var(--font-mono);
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.2s ease;
        }

        .theme-btn:hover {
            border-color: var(--accent-cyan);
            color: var(--accent-cyan);
        }

        /* Composants Formulaire & Modal */
        .card-custom {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 10px 30px var(--shadow-color);
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        .form-label {
            color: var(--text-main);
            font-weight: 500;
        }

        .form-control {
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.2s ease;
        }

        .form-control:focus {
            background-color: var(--input-bg);
            color: var(--text-main);
            border-color: var(--accent-cyan);
            box-shadow: 0 0 8px rgba(0, 242, 254, 0.25);
        }

        .modal-content {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        .modal-header {
            border-bottom: 1px solid var(--border-color);
        }

        .modal-footer {
            border-top: 1px solid var(--border-color);
        }

        .btn-close {
            filter: var(--close-filter);
        }
    </style>

    <!-- JavaScript Bootstrap & Validation -->
    <script src="js/bootstrap.bundle.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/form-validation.js"></script>
</head>
<body>

    <div class="container py-4">
        
        <!-- Navigation haute avec bouton Thème -->
        <nav class="top-nav">
            <div class="nav-left">
                <a href="../index.html" class="back-btn"><i class="fa-solid fa-house"></i> Index</a>
                <button id="theme-toggle" class="theme-btn" title="Changer le mode">
                    <i id="theme-icon" class="fa-solid fa-moon"></i>
                    <span id="theme-label">Sombre</span>
                </button>
            </div>
            <span class="nav-brand"><i class="fa-solid fa-terminal"></i> root@cybersec:~# ./tp3_bootstrap.sh</span>
        </nav>

        <!-- Titre -->
        <div class="mb-4">
            <h1 class="h2 fw-bold page-title">TP #3 : Formulaire avec Bootstrap 5</h1>
            <p class="text-muted">Saisie et validation dynamique des données d'un utilisateur.</p>
        </div>

        <!-- Formulaire Horizontal Bootstrap -->
        <div class="card-custom">
            <form>
                
                <!-- Nom -->
                <div class="row mb-3 align-items-center">
                    <label for="name" class="col-sm-3 col-form-label form-label">Nom</label>
                    <div class="col-sm-9">
                        <input type="text" class="form-control" id="name" placeholder="Ex: HAJJI" required>
                    </div>
                </div>

                <!-- Prénom -->
                <div class="row mb-3 align-items-center">
                    <label for="firstname" class="col-sm-3 col-form-label form-label">Prénom</label>
                    <div class="col-sm-9">
                        <input type="text" class="form-control" id="firstname" placeholder="Ex: Abderrazak" required>
                    </div>
                </div>

                <!-- Date de naissance -->
                <div class="row mb-3 align-items-center">
                    <label for="birthday" class="col-sm-3 col-form-label form-label">Date de naissance</label>
                    <div class="col-sm-9">
                        <input type="date" class="form-control" id="birthday" required>
                    </div>
                </div>

                <!-- Adresse postale -->
                <div class="row mb-3 align-items-center">
                    <label for="address" class="col-sm-3 col-form-label form-label">Adresse postale</label>
                    <div class="col-sm-9">
                        <input type="text" class="form-control" id="address" placeholder="Ex: 138 Avenue Division Leclerc, Villetaneuse" required>
                    </div>
                </div>

                <!-- Adresse mail -->
                <div class="row mb-4 align-items-center">
                    <label for="email" class="col-sm-3 col-form-label form-label">Adresse mail</label>
                    <div class="col-sm-9">
                        <input type="email" class="form-control" id="email" placeholder="nom@domaine.fr" required>
                    </div>
                </div>

                <!-- Bouton Submit -->
                <div class="row">
                    <div class="col-sm-9 offset-sm-3">
                        <button type="submit" id="submit" class="btn btn-primary px-4">Valider le formulaire</button>
                    </div>
                </div>

            </form>
        </div>

    </div>

    <!-- Fenêtre Modale (Popup Bootstrap) -->
    <div class="modal fade" id="myModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold" id="exampleModalLabel">Modal title</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    ...
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" data-bs-dismiss="modal">OK</button>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
